<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CRM System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div class="min-h-screen flex flex-col">
        <!-- Header / Navbar -->
        <header class="bg-slate-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <i class="fa-solid fa-chart-line text-2xl text-indigo-400 me-2"></i>
                    <h1 class="text-xl font-bold">نظام إدارة العملاء (CRM)</h1>
                </div>

                <!-- Notification Dropdown Area -->
                <div class="relative">
                    <button id="notifBtn" onclick="toggleNotifications()" class="relative p-2 bg-slate-800 hover:bg-slate-700 rounded-full transition">
                        <i class="fa-solid fa-bell text-lg text-amber-400"></i>
                        <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
                    </button>

                    <!-- Notifications Menu -->
                    <div id="notifMenu" class="hidden absolute left-0 mt-3 w-80 sm:w-96 bg-white rounded-lg shadow-xl border border-slate-200 z-50 text-slate-800">
                        <div class="p-3 bg-slate-50 border-b space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm">متابعات اليوم المتبقية</span>
                                <button onclick="sendEmailReport()" class="text-xs bg-indigo-600 text-white px-2 py-1 rounded hover:bg-indigo-700 transition">
                                    <i class="fa-solid fa-envelope me-1"></i> إرسال للأيميل
                                </button>
                            </div>
                            <!-- Quick Filter Inside Notifications -->
                            <input type="text" id="notifSearch" oninput="checkTodayFollowUps()" placeholder="بحث باسم العميل أو رقم الفايل..." class="w-full text-xs p-1.5 border rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div id="notifList" class="max-h-64 overflow-y-auto divide-y divide-slate-100">
                            <!-- Items inserted dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
            
            <!-- Controls Bar with Advanced Search -->
            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-2 w-full sm:w-96 bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 focus-within:ring-2 focus-within:ring-indigo-500">
                    <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderClients()" placeholder="ابحث برقم الملف (FILE-1001)، الاسم، أو الهاتف..." class="bg-transparent text-sm w-full focus:outline-none">
                    <button onclick="clearSearch()" class="text-xs text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <button onclick="openClientModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> إضافة عميل جديد
                </button>
            </div>

            <!-- Table Container -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                            <tr>
                                <th class="p-4">رقم الملف</th>
                                <th class="p-4">اسم العميل</th>
                                <th class="p-4">الهاتف</th>
                                <th class="p-4">المسؤول</th>
                                <th class="p-4">الحالة</th>
                                <th class="p-4">المتابعة القادمة</th>
                                <th class="p-4">الملاحظات</th>
                                <th class="p-4 text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="clientTableBody" class="divide-y divide-slate-100">
                            <!-- Client Rows Rendered Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal 1: Add/Edit Client -->
    <div id="clientModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg">إضافة عميل جديد</h3>
                <button onclick="closeClientModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="clientForm" onsubmit="saveClient(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="clientId">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">رقم الملف (File ID)</label>
                        <input type="text" id="fileId" required class="w-full border rounded-lg p-2 text-sm bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">اسم العميل</label>
                        <input type="text" id="clientName" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">رقم الهاتف</label>
                        <input type="text" id="clientPhone" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الموظف المسؤول</label>
                        <input type="text" id="assignedTo" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">حالة العميل</label>
                        <select id="clientStatus" class="w-full border rounded-lg p-2 text-sm">
                            <option value="جديد">جديد</option>
                            <option value="قيد المتابعة">قيد المتابعة</option>
                            <option value="حجز">حجز</option>
                            <option value="مفقود">مفقود / غير مهتم</option>
                            <option value="لم يرد">لم يرد</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ المتابعة القادمة</label>
                        <input type="date" id="followUpDate" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الملاحظات وتفاصيل العميل</label>
                    <textarea id="clientNotes" rows="3" class="w-full border rounded-lg p-2 text-sm" placeholder="أدخل أي التفاصيل أو اهتمامات للعميل..."></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="closeClientModal()" class="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-slate-50">إلغاء</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: Follow-Up Action Modal -->
    <div id="followUpModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">تسجيل نتيجة المتابعة (Follow-up)</h3>
                <button onclick="closeFollowUpModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="followUpForm" onsubmit="saveFollowUpResult(event)" class="p-6 space-y-4">
                <input type="hidden" id="fuClientId">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">نتيجة التواصل مع العميل:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50">
                            <input type="radio" name="fuStatus" value="حجز" required onclick="toggleRescheduleDate(false)">
                            <span class="text-sm font-semibold text-emerald-600">🎉 حجز (Booked)</span>
                        </label>
                        <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50">
                            <input type="radio" name="fuStatus" value="مفقود" onclick="toggleRescheduleDate(false)">
                            <span class="text-sm font-semibold text-rose-600">❌ فقد العميل (Lost)</span>
                        </label>
                        <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50">
                            <input type="radio" name="fuStatus" value="لم يرد" onclick="toggleRescheduleDate(false)">
                            <span class="text-sm font-semibold text-amber-600">📞 لم يرد (No Answer)</span>
                        </label>
                        <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-slate-50">
                            <input type="radio" name="fuStatus" value="تجديد متابعة" id="rescheduleOption" onclick="toggleRescheduleDate(true)">
                            <span class="text-sm font-semibold text-indigo-600">📅 تجديد المتابعة</span>
                        </label>
                    </div>
                </div>

                <!-- Next Date Picker (Only shows if Reschedule selected) -->
                <div id="nextDateContainer" class="hidden">
                    <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ المتابعة القادمة الجديد</label>
                    <input type="date" id="nextFollowUpDate" class="w-full border rounded-lg p-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">ملاحظات التواصل الحالي</label>
                    <textarea id="fuNote" rows="3" required class="w-full border rounded-lg p-2 text-sm" placeholder="ما الذي تم في هذه المكالمة؟"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="closeFollowUpModal()" class="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-slate-50">إلغاء</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">تحديث الحالة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Sample Initial Data
        let clients = [
            {
                id: 1,
                fileId: 'FILE-1001',
                name: 'احمد محمود',
                phone: '01012345678',
                assignedTo: 'محمد علي',
                status: 'قيد المتابعة',
                followUpDate: new Date().toISOString().split('T')[0], // Today
                notes: 'مهتم بالرحلة البحرية، ينتظر رد الزوجة.'
            },
            {
                id: 2,
                fileId: 'FILE-1002',
                name: 'سارة خالد',
                phone: '01198765432',
                assignedTo: 'سارة أحمد',
                status: 'جديد',
                followUpDate: '2026-09-25',
                notes: 'استفسار من الفيسبوك.'
            }
        ];

        // System Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderClients();
            checkTodayFollowUps();
        });

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        // Render Table Data with Filter/Search Logic
        function renderClients() {
            const tbody = document.getElementById('clientTableBody');
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            tbody.innerHTML = '';

            const filtered = clients.filter(c => 
                c.name.toLowerCase().includes(search) || 
                c.phone.includes(search) || 
                c.fileId.toLowerCase().includes(search)
            );

            if(filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="p-8 text-center text-slate-400">
                            لا يوجد نتائج تطابق البحث "${search}"
                        </td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(client => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                
                let statusBadge = '';
                switch(client.status) {
                    case 'حجز': statusBadge = '<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">حجز</span>'; break;
                    case 'مفقود': statusBadge = '<span class="bg-rose-100 text-rose-800 text-xs px-2.5 py-1 rounded-full font-bold">مفقود</span>'; break;
                    case 'لم يرد': statusBadge = '<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">لم يرد</span>'; break;
                    default: statusBadge = '<span class="bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded-full font-bold">' + client.status + '</span>';
                }

                const isToday = client.followUpDate === getTodayString();

                tr.innerHTML = `
                    <td class="p-4 font-mono text-xs font-bold text-slate-600 bg-slate-50/50">${client.fileId}</td>
                    <td class="p-4 font-bold text-slate-800">${client.name}</td>
                    <td class="p-4 font-mono text-xs">${client.phone}</td>
                    <td class="p-4">${client.assignedTo}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4">
                        ${client.followUpDate ? `
                            <span class="${isToday ? 'bg-red-100 text-red-600 px-2 py-1 rounded font-bold' : ''}">
                                ${client.followUpDate}${isToday ? '🔔' : ''}
                            </span>
                        ` : 'غير محدد'}
                    </td>
                    <td class="p-4 max-w-xs truncate text-xs text-slate-500" title="${client.notes}">${client.notes || '-'}</td>
                    <td class="p-4 text-center space-x-2 space-x-reverse">
                        <button onclick="openFollowUpModal(${client.id})" title="تسجيل متابعة" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                            <i class="fa-solid fa-phone-volume me-1"></i> متابعة
                        </button>
                        <button onclick="editClient(${client.id})" title="تعديل" class="text-blue-600 hover:text-blue-800 p-1">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteClient(${client.id})" title="حذف" class="text-rose-600 hover:text-rose-800 p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderClients();
        }

        // Add/Edit Client Modal Logic
        function openClientModal(isEdit = false) {
            document.getElementById('modalTitle').innerText = isEdit ? 'تعديل بيانات العميل' : 'إضافة عميل جديد';
            if(!isEdit) {
                document.getElementById('clientForm').reset();
                document.getElementById('clientId').value = '';
                document.getElementById('fileId').value = 'FILE-' + Math.floor(1000 + Math.random() * 9000);
            }
            document.getElementById('clientModal').classList.remove('hidden');
        }

        function closeClientModal() {
            document.getElementById('clientModal').classList.add('hidden');
        }

        function saveClient(e) {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const clientData = {
                id: id ? parseInt(id) : Date.now(),
                fileId: document.getElementById('fileId').value,
                name: document.getElementById('clientName').value,
                phone: document.getElementById('clientPhone').value,
                assignedTo: document.getElementById('assignedTo').value,
                status: document.getElementById('clientStatus').value,
                followUpDate: document.getElementById('followUpDate').value,
                notes: document.getElementById('clientNotes').value
            };

            if(id) {
                const index = clients.findIndex(c => c.id == id);
                clients[index] = clientData;
            } else {
                clients.push(clientData);
            }

            closeClientModal();
            renderClients();
            checkTodayFollowUps();
        }

        function editClient(id) {
            const client = clients.find(c => c.id === id);
            if(!client) return;

            document.getElementById('clientId').value = client.id;
            document.getElementById('fileId').value = client.fileId;
            document.getElementById('clientName').value = client.name;
            document.getElementById('clientPhone').value = client.phone;
            document.getElementById('assignedTo').value = client.assignedTo;
            document.getElementById('clientStatus').value = client.status;
            document.getElementById('followUpDate').value = client.followUpDate || '';
            document.getElementById('clientNotes').value = client.notes || '';

            openClientModal(true);
        }

        function deleteClient(id) {
            if(confirm('هل أنت متاكد من حذف هذا العميل؟')) {
                clients = clients.filter(c => c.id !== id);
                renderClients();
                checkTodayFollowUps();
            }
        }

        // Follow-Up Result Logic
        function openFollowUpModal(clientId) {
            const client = clients.find(c => c.id === clientId);
            if(!client) return;

            document.getElementById('fuClientId').value = client.id;
            document.getElementById('followUpForm').reset();
            document.getElementById('nextDateContainer').classList.add('hidden');
            document.getElementById('followUpModal').classList.remove('hidden');
        }

        function closeFollowUpModal() {
            document.getElementById('followUpModal').classList.add('hidden');
        }

        function toggleRescheduleDate(show) {
            const container = document.getElementById('nextDateContainer');
            if(show) container.classList.remove('hidden');
            else container.classList.add('hidden');
        }

        function saveFollowUpResult(e) {
            e.preventDefault();
            const clientId = parseInt(document.getElementById('fuClientId').value);
            const client = clients.find(c => c.id === clientId);
            if(!client) return;

            const selectedStatus = document.querySelector('input[name="fuStatus"]:checked').value;
            const fuNote = document.getElementById('fuNote').value;
            const nextDate = document.getElementById('nextFollowUpDate').value;

            const todayStr = new Date().toLocaleDateString('ar-EG');
            const noteEntry = `\n[تحديث ${todayStr}]: (${selectedStatus}) - ${fuNote}`;
            client.notes = (client.notes || '') + noteEntry;

            if(selectedStatus === 'تجديد متابعة') {
                client.status = 'قيد المتابعة';
                client.followUpDate = nextDate;
            } else {
                client.status = selectedStatus;
                if(selectedStatus === 'حجز' || selectedStatus === 'مفقود') {
                    client.followUpDate = '';
                }
            }

            closeFollowUpModal();
            renderClients();
            checkTodayFollowUps();
        }

        // Notifications & Dynamic Filter
        function checkTodayFollowUps() {
            const today = getTodayString();
            const filterText = (document.getElementById('notifSearch')?.value || '').toLowerCase();
            
            let todayClients = clients.filter(c => c.followUpDate === today && c.status !== 'حجز' && c.status !== 'مفقود');
            
            const badge = document.getElementById('notifBadge');
            const notifList = document.getElementById('notifList');

            if(todayClients.length > 0) {
                badge.innerText = todayClients.length;
                badge.classList.remove('hidden');

                // Apply inner search filter for notifications
                if(filterText) {
                    todayClients = todayClients.filter(c => c.name.toLowerCase().includes(filterText) || c.fileId.toLowerCase().includes(filterText));
                }

                if(todayClients.length === 0) {
                    notifList.innerHTML = `<div class="p-3 text-center text-xs text-slate-400">لا يوجد عملاء يطابقون نتائج البحث</div>`;
                    return;
                }

                notifList.innerHTML = todayClients.map(c => `
                    <div class="p-3 hover:bg-slate-50 flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-slate-800">${c.name} <span class="text-indigo-600 font-mono">(${c.fileId})</span></p>
                            <p class="text-slate-500">${c.phone} - المسؤول: ${c.assignedTo}</p>
                        </div>
                        <button onclick="openFollowUpModal(${c.id}); toggleNotifications();" class="bg-indigo-600 text-white px-2 py-1 rounded font-bold">متابعة</button>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                notifList.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">لا توجد مواعيد متابعة مستحقة اليوم 🎉</div>`;
            }
        }

        function toggleNotifications() {
            document.getElementById('notifMenu').classList.toggle('hidden');
        }

        function sendEmailReport() {
            const today = getTodayString();
            const todayClients = clients.filter(c => c.followUpDate === today);

            if(todayClients.length === 0) {
                alert('لا يوجد مواعيد متابعة اليوم لإرسالها.');
                return;
            }

            let mailBody = `ملاحظة: قائمة عملاء المتابعة المستحقة اليوم (${today}):\n\n`;
            todayClients.forEach((c, index) => {
                mailBody += `${index + 1}. العميل: ${c.name} | رقم الملف: ${c.fileId} | الهاتف: ${c.phone} | المسؤول: ${c.assignedTo}\n`;
            });

            const mailtoUrl = `mailto:admin@example.com?subject=تنبيه CRM: متابعات اليوم ${today}&body=${encodeURIComponent(mailBody)}`;
            window.location.href = mailtoUrl;
        }
    </script>
</body>
</html>
